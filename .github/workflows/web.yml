name: FMDS Pages Assembly
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  assemble:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
      - name: Assemble production and open PR previews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          site="$RUNNER_TEMP/fmds-site"
          mkdir -p "$site"
          build_site() (
            cd apps/render_lab
            flutter pub get || exit 1
            dart format lib test || exit 1
            flutter analyze || exit 1
            flutter test || exit 1
            version=$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)
            flutter build web --release --base-href "$1" --dart-define="FMDS_VERSION=$version" --dart-define="FMDS_ENV=$3" --dart-define="FMDS_COMMIT=$(git rev-parse --short HEAD)" --dart-define="FMDS_PR=$4" || exit 1
            for page in physical-glass hybrid-glass glass-compare glass-unified; do
              cp "web/$page.html" "build/web/$page.html" || exit 1
            done
            mkdir -p "$2" || exit 1
            cp -a build/web/. "$2/" || exit 1
            printf '%s\n' "$(git rev-parse HEAD)" > "$2/commit.txt"
          )
          build_site "/${REPO#*/}/" "$site" production ""
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | select(.head.repo.full_name == .base.repo.full_name and .base.ref == "main") | [.number,.head.sha] | @tsv' > "$RUNNER_TEMP/fmds-prs"
          while IFS=$'\t' read -r number sha; do
            [[ "$number" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git reset --hard
            git clean -fd
            git fetch --no-tags origin "refs/pull/$number/head"
            git checkout --detach "$sha"
            candidate="$RUNNER_TEMP/fmds-preview-$number"
            rm -rf "$candidate"
            if build_site "/${REPO#*/}/previews/pr-$number/" "$candidate" preview "$number"; then
              mkdir -p "$site/previews"
              mv "$candidate" "$site/previews/pr-$number"
            else
              rm -rf "$candidate"
              echo "::warning::PR #$number failed validation; preview omitted"
              echo "- PR #$number: validation failed; preview omitted" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$RUNNER_TEMP/fmds-prs"
          test -f "$site/index.html"
          echo "Production: https://${REPO%/*}.github.io/${REPO#*/}/" >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r number sha; do
            [[ -f "$site/previews/pr-$number/index.html" ]] || continue
            echo "- PR #$number: https://${REPO%/*}.github.io/${REPO#*/}/previews/pr-$number/ ($sha)" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/fmds-prs"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/fmds-site
  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

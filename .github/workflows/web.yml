name: Flutter Web CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/render_lab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /flutter-motion-design-system/
      - run: cp web/physical-glass.html build/web/physical-glass.html
      - run: cp web/hybrid-glass.html build/web/hybrid-glass.html
      - run: cp web/glass-compare.html build/web/glass-compare.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/render_lab/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

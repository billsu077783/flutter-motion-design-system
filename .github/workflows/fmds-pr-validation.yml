name: FMDS PR Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fmds-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/render_lab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.5'
      - run: flutter --version
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /flutter-motion-design-system/
